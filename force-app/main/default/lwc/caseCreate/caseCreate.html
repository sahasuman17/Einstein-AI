<template>
    <div class="case-page-container">

        <!-- ===== PAGE TITLE BAR ===== -->
        <div class="page-title-bar">
            <h1>Create a Support Case</h1>
        </div>

        <!-- ===== HEADER ===== -->
        <div class="case-header slds-p-around_medium slds-border_bottom">
            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-start">
                <!-- Left: Case identity -->
                <div class="slds-col">
                    <p class="case-type-label">Parts Technical Help</p>
                    <p class="case-number">1247008</p>
                    <div class="status-block">
                        <p class="status-label">Status</p>
                        <p class="status-value">New</p>
                    </div>
                </div>
                <!-- Right: Action links -->
                <div class="slds-col slds-text-align_right">
                    <div class="header-actions slds-m-bottom_xx-small">
                        <button class="header-action-btn" type="button">
                            <lightning-icon icon-name="utility:favorite" size="xx-small" class="slds-m-right_xxx-small"></lightning-icon>
                            Add Favorite
                        </button>
                        <button class="header-action-btn slds-m-left_medium" type="button">Copy</button>
                        <button class="header-action-btn slds-m-left_medium" type="button">Print to PDF</button>
                    </div>
                    <p class="required-note"><span class="slds-text-color_error">*</span> = Required Information</p>
                </div>
            </div>
        </div>

        <!-- ===== SECTION: Asset / Serial Number Information ===== -->
        <div class="section-wrapper">
            <button class="section-header" type="button" data-section="asset" onclick={toggleSection}>
                <lightning-icon icon-name={assetChevron} size="xx-small" class="chevron-icon"></lightning-icon>
                <span class="section-title">Asset /Serial Number Information</span>
            </button>
            <template if:true={assetOpen}>
                <div class="section-body">
                    <div class="slds-m-bottom_small">
                        <lightning-input
                            type="toggle"
                            label="Asset/Serial Number Not Applicable"
                            checked={assetNotApplicable}
                            onchange={handleAssetToggle}
                            message-toggle-active=""
                            message-toggle-inactive="">
                        </lightning-input>
                    </div>
                    <div class="slds-grid slds-wrap slds-gutters_small slds-grid_vertical-align-end">
                        <div class="slds-col slds-size_3-of-12">
                            <lightning-input
                                label="Asset/Serial Number"
                                required
                                value={assetSerialNumber}
                                onchange={handleAssetSerialChange}
                                onblur={handleAssetSearch}
                                onkeyup={handleAssetKeyUp}>
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_3-of-12 slds-p-bottom_xx-small">
                            <button
                                type="button"
                                class="clear-search-link"
                                onclick={handleClearSearch}>
                                Clear Search
                            </button>
                        </div>
                    </div>
                    <template if:true={assetMatchFound}>
                        <div class="match-banner slds-m-top_small">
                            <lightning-icon
                                icon-name="utility:check"
                                size="x-small"
                                variant="success"
                                alternative-text="Match found"
                                class="slds-m-right_x-small">
                            </lightning-icon>
                            <em>VIN/Serial Number found. Product information has been added below.</em>
                        </div>
                    </template>
                </div>
            </template>
        </div>

        <!-- ===== SECTION: Product Information ===== -->
        <div class="section-wrapper">
            <button class="section-header" type="button" data-section="product" onclick={toggleSection}>
                <lightning-icon icon-name={productChevron} size="xx-small" class="chevron-icon"></lightning-icon>
                <span class="section-title">Product Information</span>
            </button>
            <template if:true={productOpen}>
                <div class="section-body">
                    <!-- Row 1 -->
                    <div class="slds-grid slds-wrap slds-gutters_small slds-m-bottom_small">
                        <div class="slds-col slds-size_3-of-12">
                            <lightning-input
                                label="Brand"
                                required
                                value={brand}
                                onchange={handleBrandChange}>
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_3-of-12">
                            <lightning-input
                                label="Machine Type"
                                required
                                value={machineType}
                                onchange={handleMachineTypeChange}>
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_3-of-12">
                            <lightning-input
                                label="Series"
                                required
                                value={series}
                                onchange={handleSeriesChange}>
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_3-of-12">
                            <lightning-input
                                label="Model Number"
                                required
                                value={modelNumber}
                                onchange={handleModelNumberChange}>
                            </lightning-input>
                        </div>
                    </div>
                    <!-- Row 2 -->
                    <div class="slds-grid slds-wrap slds-gutters_small slds-m-bottom_small">
                        <div class="slds-col slds-size_3-of-12">
                            <lightning-combobox
                                label="Unit of Measure"
                                options={unitOptions}
                                value={unitOfMeasure}
                                onchange={handleUnitOfMeasureChange}
                                placeholder="Select">
                            </lightning-combobox>
                        </div>
                        <div class="slds-col slds-size_3-of-12">
                            <lightning-combobox
                                label="Machine Usage"
                                options={usageOptions}
                                value={machineUsage}
                                onchange={handleMachineUsageChange}
                                placeholder="Select">
                            </lightning-combobox>
                        </div>
                        <div class="slds-col slds-size_3-of-12">
                            <lightning-input
                                label="Used With"
                                value={usedWith}
                                onchange={handleUsedWithChange}>
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_3-of-12">
                            <lightning-input
                                type="text"
                                label="Engine Serial #"
                                value={engineSerial}
                                onchange={handleEngineSerialChange}>
                            </lightning-input>
                        </div>
                    </div>
                    <!-- Row 3 -->
                    <div class="slds-grid slds-wrap slds-gutters_small">
                        <div class="slds-col slds-size_3-of-12 part-search-wrapper">
                            <lightning-input
                                label="Part Number #"
                                placeholder="Search"
                                value={partNumberText}
                                onchange={handlePartInput}
                                onfocus={handlePartFocus}
                                onblur={handlePartBlur}>
                            </lightning-input>
                            <template if:true={hasPartResults}>
                                <div class="part-search-dropdown">
                                    <template for:each={partResults} for:item="p">
                                        <div
                                            key={p.id}
                                            class="part-search-item"
                                            data-id={p.id}
                                            onmousedown={handlePartSelect}>
                                            <div class="part-search-name">{p.name}</div>
                                            <div class="part-search-description">{p.description}</div>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                        <div class="slds-col slds-size_3-of-12">
                            <lightning-input
                                label="Part Description"
                                value={partDescription}
                                class="part-description-readonly"
                                read-only>
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_3-of-12">
                            <lightning-combobox
                                label="No Part Reason"
                                options={noPartReasonOptions}
                                value={noPartReason}
                                onchange={handleNoPartReasonChange}
                                placeholder="Select">
                            </lightning-combobox>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- ===== FOOTER ACTION BAR ===== -->
        <div class="footer-actions slds-border_top">
            <lightning-button
                label="Save"
                variant="brand"
                onclick={handleSave}
                disabled={isSaveDisabled}
                class="mp-btn-primary">
            </lightning-button>
            <lightning-button
                label="Submit"
                variant="neutral"
                class="mp-btn-outlined">
            </lightning-button>
            <lightning-button
                label="Resolve"
                variant="neutral"
                class="mp-btn-outlined">
            </lightning-button>
            <lightning-button
                label="Cancel"
                variant="neutral"
                class="mp-btn-outlined">
            </lightning-button>
        </div>

    </div>
</template>
